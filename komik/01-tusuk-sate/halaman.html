<script>
/* ============================================================================
   Komik 01 — "Rumah Tusuk Sate"
   1080 x 1920 (9:16) · 4 panel · digambar murni canvas, deterministik
   ========================================================================== */

const W = 1080, H = 1920;
const cv = document.getElementById('cv');
const c = cv.getContext('2d');
cv.width = W; cv.height = H;

const INK   = '#2A1B24';
const KERTAS= '#F7EFE3';
const EMAS  = '#C9A45C';
const EMAS_T= '#F1DDA8';
const SEGEL = '#A8161D';
const GIOK  = '#2E7D63';
const KREM  = '#FFE4CF';

/* ---- util ---- */
function rnd(seed) { let s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function garing(c, x0, y0, x1, y1) { const g = c.createLinearGradient(x0, y0, x1, y1); return g; }
function teksBungkus(c, teks, maksW) {
  const kata = teks.split(' ');
  const baris = [];
  let kini = '';
  for (const k of kata) {
    const uji = kini ? kini + ' ' + k : k;
    if (c.measureText(uji).width > maksW && kini) { baris.push(kini); kini = k; }
    else kini = uji;
  }
  if (kini) baris.push(kini);
  return baris;
}
function tulis(c, teks, x, y, maksW, lh, font, warna, align) {
  c.save();
  c.font = font; c.fillStyle = warna; c.textAlign = align || 'center'; c.textBaseline = 'top';
  const baris = teksBungkus(c, teks, maksW);
  const y0 = y - (baris.length - 1) * lh / 2;
  baris.forEach((b, i) => c.fillText(b, x, y0 + i * lh));
  c.restore();
  return baris.length * lh;
}

/* ---- panel ---- */
function panel(x, y, w, h, isi) {
  c.save();
  c.beginPath(); c.rect(x, y, w, h); c.clip();
  c.translate(x, y);
  isi(w, h);
  c.restore();
  /* garis panel: kertas tipis lalu tinta */
  c.save();
  c.strokeStyle = KERTAS; c.lineWidth = 14;
  c.beginPath(); c.rect(x, y, w, h); c.stroke();
  c.strokeStyle = INK; c.lineWidth = 6;
  c.beginPath(); c.rect(x, y, w, h); c.stroke();
  c.restore();
}

/* ---- rumah ---- */
function rumah(c, cx, kaki, w, hh, warnaBadan, warnaAtap, tanda) {
  const x = cx - w / 2, y = kaki - hh;
  /* bayangan */
  c.fillStyle = 'rgba(60,36,28,.18)';
  c.beginPath(); c.ellipse(cx, kaki + 6, w * 0.62, w * 0.13, 0, 0, Math.PI * 2); c.fill();
  /* badan */
  const gb = c.createLinearGradient(x, y, x + w, y + hh);
  gb.addColorStop(0, warnaBadan[0]);
  gb.addColorStop(0.5, warnaBadan[1]);
  gb.addColorStop(0.5, warnaBadan[2]);
  c.fillStyle = gb;
  c.fillRect(x, y, w, hh);
  c.strokeStyle = INK; c.lineWidth = 5; c.strokeRect(x, y, w, hh);
  /* atap */
  const ra = hh * 0.46;
  const gr = c.createLinearGradient(x, y - ra, x + w, y);
  gr.addColorStop(0, warnaAtap[0]);
  gr.addColorStop(1, warnaAtap[1]);
  c.fillStyle = gr;
  c.beginPath();
  c.moveTo(x - w * 0.08, y);
  c.lineTo(cx, y - ra);
  c.lineTo(x + w * 1.08, y);
  c.closePath(); c.fill();
  c.strokeStyle = INK; c.lineWidth = 5; c.stroke();
  /* garis genteng */
  c.save();
  c.beginPath(); c.moveTo(x - w * 0.08, y); c.lineTo(cx, y - ra); c.lineTo(x + w * 1.08, y); c.closePath(); c.clip();
  c.strokeStyle = 'rgba(42,27,36,.28)'; c.lineWidth = 2.5;
  for (let i = 1; i < 5; i++) {
    const t = i / 5;
    c.beginPath();
    c.moveTo(x - w * 0.08 + (cx - (x - w * 0.08)) * t, y + (y - ra - y) * t);
    c.lineTo(x + w * 1.08 + (cx - (x + w * 1.08)) * t, y);
    c.stroke();
  }
  c.restore();
  /* pintu */
  const dw = w * 0.24, dh = hh * 0.52;
  c.fillStyle = tanda === 'merah' ? '#9C3038' : '#8A6A4E';
  rr(c, cx - dw / 2, kaki - dh, dw, dh, 5); c.fill();
  c.strokeStyle = INK; c.lineWidth = 4; c.stroke();
  c.fillStyle = EMAS_T;
  c.beginPath(); c.arc(cx + dw * 0.28, kaki - dh * 0.48, 6, 0, 7); c.fill();
  /* jendela */
  for (const sx of [-1, 1]) {
    const wx = cx + sx * w * 0.31, wy = y + hh * 0.18, ww = w * 0.2, wh = hh * 0.26;
    c.fillStyle = '#8FA9BF';
    c.fillRect(wx - ww / 2, wy, ww, wh);
    c.strokeStyle = INK; c.lineWidth = 4; c.strokeRect(wx - ww / 2, wy, ww, wh);
    c.beginPath();
    c.moveTo(wx, wy); c.lineTo(wx, wy + wh);
    c.moveTo(wx - ww / 2, wy + wh / 2); c.lineTo(wx + ww / 2, wy + wh / 2);
    c.stroke();
  }
}

/* ---- balon kata ---- */
function balon(c, x, y, w, h, teks, ekor) {
  c.save();
  /* badan balon */
  c.fillStyle = '#FFFFFF';
  c.strokeStyle = INK;
  c.lineWidth = 6;
  rr(c, x, y, w, h, Math.min(w, h) * 0.38);
  c.fill();
  /* ekor digambar sebagai bagian dari siluet, jadi isi dulu lalu garis nanti */
  if (ekor) {
    c.beginPath();
    c.moveTo(ekor.x - 22, ekor.y0);
    c.lineTo(ekor.x + 4, ekor.y1);
    c.lineTo(ekor.x + 26, ekor.y0);
    c.closePath();
    c.fill();
  }
  c.restore();

  /* teks */
  tulis(c, teks, x + w / 2, y + h / 2, w - 56, 46,
    "800 38px 'Baloo 2', 'Segoe UI', system-ui, sans-serif", INK);

  /* garis balon (diulang supaya ekor tidak tertutup) */
  c.save();
  c.strokeStyle = INK; c.lineWidth = 6; c.lineJoin = 'round';
  rr(c, x, y, w, h, Math.min(w, h) * 0.38);
  c.stroke();
  if (ekor) {
    c.fillStyle = '#FFFFFF';
    c.strokeStyle = INK;
    c.beginPath();
    c.moveTo(ekor.x - 22, ekor.y0);
    c.lineTo(ekor.x + 4, ekor.y1);
    c.lineTo(ekor.x + 26, ekor.y0);
    c.closePath();
    c.fill(); c.stroke();
    /* tutup garis pangkal ekor */
    c.strokeStyle = '#FFFFFF'; c.lineWidth = 9;
    c.beginPath(); c.moveTo(ekor.x - 20, ekor.y0 + 3); c.lineTo(ekor.x + 24, ekor.y0 + 3); c.stroke();
  }
  c.restore();
}

/* ---- kotak narasi ---- */
function narasi(c, x, y, w, teks) {
  c.save();
  c.font = "700 31px 'Baloo 2', 'Segoe UI', system-ui, sans-serif";
  const baris = teksBungkus(c, teks, w - 44);
  const h = baris.length * 40 + 30;
  c.fillStyle = '#FFF9EC';
  c.strokeStyle = INK; c.lineWidth = 5;
  c.fillRect(x, y, w, h);
  c.strokeRect(x, y, w, h);
  c.fillStyle = EMAS;
  c.fillRect(x, y, 10, h);
  c.restore();
  tulis(c, teks, x + 28 + (w - 44) / 2, y + h / 2, w - 48, 40,
    "700 31px 'Baloo 2', 'Segoe UI', system-ui, sans-serif", INK, 'center');
  return h;
}

/* ---- karakter: potret dada ---- */
function dada(o, px, py, sk) {
  const kaki = py + 935 * sk;
  TOKOH2.gambar(c, Object.assign({}, o, { x: px, y: kaki, s: sk }));
}

   HALAMAN
   ========================================================================== */

  c.beginPath(); c.moveTo(430, h); c.lineTo(411, 442); c.stroke();
  c.setLineDash([]);
  c.strokeStyle = '#B99570'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(286, h); c.lineTo(394, 436); c.moveTo(574, h); c.lineTo(426, 436); c.stroke();

  /* pagar */
  c.strokeStyle = '#8A6A4E'; c.lineWidth = 5;
  for (let i = 0; i < 14; i++) {
    const x = 120 + i * 58;

  c.beginPath(); c.moveTo(120, 436); c.lineTo(120 + 13 * 58, 436); c.stroke();

  /* papan DIJUAL */

  c.strokeStyle = INK; c.lineWidth = 5; c.strokeRect(-92, -62, 184, 78);
  c.fillStyle = SEGEL; c.fillRect(-92, -62, 184, 30);
  c.fillStyle = '#FFFFFF';
  c.font = "400 22px 'Archivo Black', Impact, sans-serif";
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('DIJUAL', 0, -46);
  c.fillStyle = INK;
  c.font = "800 22px 'Baloo 2', 'Segoe UI', sans-serif";
  c.fillText('MURAH 20%', 0, -12);
  c.restore();
});
